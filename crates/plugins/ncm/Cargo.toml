[package]
name = "novaplayer-plugin-ncm"
version = "0.0.1"
license = "MIT OR Apache-2.0"
edition = "2021"
description = "NovaPlayer plugin: NetEase Cloud Music account (QR sign-in), user playlists, highest-quality streams"

[[bin]]
name = "ncm-plugin"
path = "src/main.rs"

[dependencies]
kit = { path = "../kit", package = "novaplayer-plugin-kit" }
aes = "=0.8.4"
cbc = "=0.1.2"
# cipher's `alloc` gives encrypt_padded_vec_mut.
cipher = { version = "=0.4.4", features = ["alloc", "block-padding"] }
num-bigint = "=0.4.6"
md5 = "=0.7.0"

[lints]
workspace = true
